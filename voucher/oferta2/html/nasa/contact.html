        <br>
        <h1 id="title">Contato:</h1>
        <form class="contact_form" action="*" method="POST">
            <label for="name">Nome:</label>
            <input class="input_field" type="text" id="name" name="name" required>
        
            <label for="email">Email:</label>
            <input class="input_field" type="email" id="email" name="email" required>
        
            <label for="phone">Telefone:</label>
            <input class="input_field" type="tel" id="phone" name="phone" required>
        
            <label for="message">Mensagem:</label>
            <textarea class="input_field" id="message" name="message" rows="5" required></textarea>
        
            <button type="submit">Enviar</button>
        </form>
    </body>
</html>
