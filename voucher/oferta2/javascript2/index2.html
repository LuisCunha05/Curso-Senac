<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body{
            margin: 0;
            padding: 0;
            border: 0;
            box-sizing: border-box;
            min-width: 100vw;
            min-height: 100vh;
        }
        body{
            background-color: black;
            display: flex;
            flex-wrap: wrap;
            align-items: start;
            justify-content: start;
        }
        .button{
            min-width: 196px;
            max-width: 256px;
            height: 48px;
            gap: 0px;
        }
        .red {
            background-color: #FF0000;
        }

        .orange {
            background-color: #FFA500;
        }

        .yellow {
            background-color: #FFFF00;
        }

        .green {
            background-color: #008000;
        }

        .blue {
            background-color: #0000FF;
        }

        .indigo {
            background-color: #4B0082;
        }

        .violet {
            background-color: #8A2BE2;
        }

        .pink {
            background-color: #FF1493;
        }

        .turquoise {
            background-color: #40E0D0;
        }

        .golden-yellow {
            background-color: #FFD700;
        }

        .lavender {
            background-color: #E6E6FA;
        }

        .crimson {
            background-color: #DC143C;
        }

    </style>
</head>
<body id="corpo">
    <script>
        const colorClasses = [
            'red',
            'orange',
            'yellow',
            'green',
            'blue',
            'indigo',
            'violet',
            'pink',
            'turquoise',
            'golden-yellow',
            'lavender',
            'crimson'
        ];
        let buttonCount = 1

        const addButton = (id) => {
            const button = document.createElement('button')
            button.innerText = `Botão N: ${buttonCount++}`
            button.className = `button ${colorClasses[Math.floor(colorClasses.length * Math.random())]}`
            const value = `${Math.floor(Math.random() * 1000).toFixed(2)} R$`
            button.addEventListener('click', () => {
                alert(value)
            })

            document.body.appendChild(button)
        }
        for (let index = 0; index < 200; index++) {
            addButton()
        }
    </script>
</body>
</html>
