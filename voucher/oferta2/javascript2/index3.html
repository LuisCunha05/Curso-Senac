<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body{
            margin: 0;
            padding: 0;
            border: 0;
            box-sizing: border-box;
            min-width: 100vw;
            min-height: 100vh;
            font-size: 2rem;
        }
        .acordo{
            background-color: aqua;
            height: fit-content;
            border: 2px solid brown;
            border-radius: 10px;
            padding: 20px 40px;
        }
        #acordo_text{
            width: fit-content;
            max-height: 0px;
            overflow: hidden;
        }
        #acordo_text.ativo{
            max-height: max-content;
        }
    </style>
</head>
<body>
    <div class="acordo">
        <button id="btn" >O é JavaScript</button>
        <div id="acordo_text">
            é uma linguagem de programação
        </div>
    </div>
    
    <script>
        const btn = document.getElementById('btn')
        btn.addEventListener('click', () => {
            console.log('aaaaaaaa')
            document.getElementById('acordo_text').classList.toggle('ativo')
        })

    </script>
</body>
</html>
